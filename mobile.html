<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANYATECH — Mobile Phone Version Viewer</title>
  <meta name="description" content="Interactive Smartphone Device Simulator to test and view the mobile phone version of the ANYATECH website.">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #0B3060;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    .mobile-viewer-header {
      text-align: center;
      max-width: 700px;
      margin-bottom: 2rem;
    }

    .mobile-viewer-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
    }

    .mobile-viewer-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1rem;
    }

    /* Device Controls Toolbar */
    .controls-bar {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .control-label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 600;
    }

    .control-select {
      background: #072246;
      color: #FFFFFF;
      border: 1px solid rgba(200, 155, 60, 0.4);
      padding: 0.45rem 1rem;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .btn-rotate {
      background: var(--brand-accent);
      color: #072246;
      font-weight: 700;
      padding: 0.45rem 1.2rem;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all var(--transition-fast);
    }

    .btn-rotate:hover {
      background: var(--brand-accent-hover);
      color: #FFFFFF;
    }

    /* Smartphone Device Frame */
    .phone-device {
      position: relative;
      width: 390px;
      height: 800px;
      background: #1C1C1E;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6), 0 0 40px rgba(200, 155, 60, 0.25);
      border: 4px solid #3A3A3C;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .phone-device.landscape {
      width: 800px;
      height: 390px;
    }

    /* Dynamic Island / Notch */
    .phone-notch {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }

    .phone-camera {
      width: 12px;
      height: 12px;
      background: #111;
      border-radius: 50%;
      border: 2px solid #222;
    }

    /* Phone Screen Content */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
    }

    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Mobile Quick Direct Link Button */
    .mobile-direct-link {
      margin-top: 2.5rem;
      text-align: center;
    }

    .btn-direct {
      background: var(--brand-accent);
      color: #072246;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem 2.2rem;
      border-radius: 30px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(200, 155, 60, 0.35);
      transition: all var(--transition-fast);
    }

    .btn-direct:hover {
      background: var(--brand-accent-hover);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- Viewer Header -->
  <div class="mobile-viewer-header">
    <h1 class="mobile-viewer-title">ANYATECH Mobile Phone Viewer</h1>
    <p class="mobile-viewer-subtitle">Experience the fully responsive smartphone version of ANYATECH. Select pages or switch device orientations below.</p>
  </div>

  <!-- Device Controls Toolbar -->
  <div class="controls-bar">
    <div class="control-group">
      <span class="control-label">Select Page:</span>
      <select id="pageSelect" class="control-select" onchange="changePage(this.value)">
        <option value="index.html">Home Page</option>
        <option value="landing-pages.html">Landing Pages Development</option>
        <option value="website-development.html">Website Development</option>
        <option value="lms-development.html">LMS Development</option>
        <option value="app-development.html">App Development</option>
        <option value="anya-lab.html">Anya Lab R&D</option>
        <option value="index-interactive.html">Interactive Ant Edition</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Device Size:</span>
      <select id="deviceSelect" class="control-select" onchange="changeDevice(this.value)">
        <option value="iphone15">iPhone 15 Pro (390px)</option>
        <option value="pixel8">Google Pixel 8 (412px)</option>
        <option value="se">iPhone SE (375px)</option>
      </select>
    </div>

    <button class="btn-rotate" onclick="toggleOrientation()">🔄 Rotate Frame</button>
  </div>

  <!-- Smartphone Mockup -->
  <div class="phone-device" id="phoneDevice">
    <div class="phone-notch">
      <div class="phone-camera"></div>
    </div>
    <div class="phone-screen">
      <iframe id="phoneFrame" src="index.html" title="Mobile Phone Preview"></iframe>
    </div>
  </div>

  <!-- Direct Open Link -->
  <div class="mobile-direct-link">
    <a href="index.html" class="btn-direct">📱 Open Direct Mobile Site (index.html) →</a>
  </div>

  <script>
    const phoneDevice = document.getElementById('phoneDevice');
    const phoneFrame = document.getElementById('phoneFrame');

    function changePage(url) {
      phoneFrame.src = url;
    }

    function changeDevice(device) {
      if (phoneDevice.classList.contains('landscape')) return;
      if (device === 'iphone15') {
        phoneDevice.style.width = '390px';
        phoneDevice.style.height = '800px';
      } else if (device === 'pixel8') {
        phoneDevice.style.width = '412px';
        phoneDevice.style.height = '820px';
      } else if (device === 'se') {
        phoneDevice.style.width = '375px';
        phoneDevice.style.height = '720px';
      }
    }

    function toggleOrientation() {
      phoneDevice.classList.toggle('landscape');
    }
  </script>
</body>
</html>
